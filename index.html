<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>AndriFIT| Mi entrenamiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="AndriFIT inicio">
        <span class="brand-mark">F</span>
        <span>Andri<span class="brand-light">FIT</span></span>
      </a>
      <span class="private-label"><span></span> Mi espacio</span>
    </header>

    <main>
      <section class="welcome">
        <div>
          <p class="eyebrow">TU ESPACIO DE ENTRENAMIENTO</p>
          <h1>Entrena a tu manera.</h1>
          <p class="muted">Organiza tus ejercicios, crea tus planes y sigue tu evolución.</p>
        </div>
      </section>

      <nav class="tabs" aria-label="Secciones">
        <button class="tab active" data-view="exercises">Ejercicios</button>
        <button class="tab" data-view="plans">Mis planes</button>
        <button class="tab" data-view="calendar">Calendario</button>
        <button class="tab" data-view="progress">Progreso</button>
      </nav>

      <section id="app-content" aria-live="polite"></section>
    </main>

    <footer>
      <span>AndriFIT</span>
      <span>Tu entrenamiento, organizado.</span>
    </footer>
  </div>

  <dialog id="modal" class="modal">
    <div class="modal-inner">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
      <div id="modal-content"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
