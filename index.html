<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <script>
    // Aplica el tema antes de pintar la página para evitar parpadeos.
    (function () {
      var theme;
      try { theme = localStorage.getItem("andrifit-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <title>AndriFIT| Mi entrenamiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="AndriFIT inicio">
        <span class="brand-mark">A</span>
        <span>Andri<span class="brand-light">FIT</span></span>
      </a>
      <div class="topbar-right">
        <span class="private-label"><span></span> Mi espacio</span>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="welcome">
        <div>
          <p class="eyebrow">TU ESPACIO DE ENTRENAMIENTO</p>
          <h1>Entrena a tu manera.</h1>
          <p class="muted">Organiza tus ejercicios, crea tus planes y sigue tu evolución.</p>
        </div>
      </section>

      <nav class="tabs" aria-label="Secciones">
        <button class="tab active" data-view="exercises">Ejercicios</button>
        <button class="tab" data-view="plans">Mis planes</button>
        <button class="tab" data-view="calendar">Calendario</button>
        <button class="tab" data-view="progress">Progreso</button>
      </nav>

      <section id="app-content" aria-live="polite"></section>
    </main>

    <footer>
      <span>AndriFIT</span>
      <span>Tu entrenamiento, organizado.</span>
    </footer>
  </div>

  <dialog id="modal" class="modal">
    <div class="modal-inner">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
      <div id="modal-content"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
  <script src="drive-sync.js"></script>
</body>
</html>
